name: Build Android APK

on:
  push:
    branches:
      - claude/esp-training-app-i3sakn
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate app icon assets
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          mkdir -p assets
          convert -size 1024x1024 xc:"#6C5CE7" assets/icon.png
          convert -size 1024x1024 xc:"#6C5CE7" assets/splash-icon.png
          convert -size 48x48 xc:"#6C5CE7" assets/favicon.png
          convert -size 512x512 xc:"#6C5CE7" assets/android-icon-foreground.png
          convert -size 512x512 xc:"#E6F4FE" assets/android-icon-background.png
          convert -size 432x432 xc:"#1B1F3B" assets/android-icon-monochrome.png

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp-trainer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
